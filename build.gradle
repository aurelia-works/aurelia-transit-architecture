plugins {
	id "fabric-loom" version "1.10.5"
}

version = "${project.mod_version}+mc${project.minecraft_version}-fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	runs {
		configureEach { ideConfigGenerated = true }
		server { runDir = "run/server" }
		client {
			runDir = "run/client"
			// Dev only: Loom runs Apple Silicon on LWJGL 3.3.2-snapshot natives; Sodium 0.5's startup check wants 3.3.1
			// and refuses to start. This switch (Sodium issue #2561) skips only that check. Not part of the mod.
			vmArg "-Dsodium.checks.issue2561=false"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// MTR is a required runtime dependency (declared in fabric.mod.json). V1 does not call MTR APIs,
	// so it is compile-only (not re-exported) and loaded in the dev runs to prove coexistence.
	modCompileOnly "maven.modrinth:minecraft-transit-railway:${project.mtr_version}"
	modLocalRuntime "maven.modrinth:minecraft-transit-railway:${project.mtr_version}"

	// Dev runs only (./gradlew runClient), for shader testing. modLocalRuntime never reaches the published jar,
	// its POM or fabric.mod.json. Iris 1.7.6 is the last 1.20.1 build and requires Sodium >= 0.5.12-beta.2;
	// Sodium 0.5.13 is the last 1.20.1 release. Both target Fabric API 0.92.x / loader >= 0.15.
	modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"

	// Pure-logic unit tests (text sanitising, caches, announcement queue, seat bookkeeping, pagination ...)
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// Runs the tests inside Fabric Loader so tests that need the game bootstrap (block state checks) can create blocks.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

// The dev-run shader stack must not start inside the unit tests (fabric-loader-junit loads every mod on the test classpath).
configurations.testRuntimeClasspath {
	exclude module: "sodium"
	exclude module: "iris"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
	withSourcesJar()
}

jar {
	from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
