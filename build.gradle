plugins {
	id "fabric-loom" version "1.10.5"
}

version = "${project.mod_version}+mc${project.minecraft_version}-fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	runs {
		configureEach { ideConfigGenerated = true }
		server {
			runDir = "run/server"
			// Dev only: -Pata.hotswap=true opens a local debug port for tools/HotSwap.java, which swaps changed method bodies
			// into the running server after compileJava (docs/LIVE_TESTING.md). Not part of the mod.
			if (project.hasProperty("ata.hotswap")) {
				vmArg "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005"
			}
		}
		client {
			runDir = "run/client"
			// Dev only: the same for the client (and its integrated server), on port 5006.
			if (project.hasProperty("ata.hotswap")) {
				vmArg "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5006"
			}
			// Dev only: Loom runs Apple Silicon on LWJGL 3.3.2-snapshot natives; Sodium 0.5's startup check wants 3.3.1
			// and refuses to start. This switch (Sodium issue #2561) skips only that check. Not part of the mod.
			vmArg "-Dsodium.checks.issue2561=false"
			// Dev only: lets scripts take the game's own screenshots through run/client/screenshot-requests (DevScreenshots).
			vmArg "-Data.devScreenshots=true"
			// Dev only: -Pata.demoBoards=true puts a made-up timetable on every live display (DemoStationData).
			vmArg "-Data.demoBoards=" + (project.findProperty("ata.demoBoards") ?: "false")
		}
	}
}

// Headless in-game tests (./gradlew runGametest): Fabric's GameTest API on a dedicated server. configureTests() adds a
// separate "gametest" source set (src/gametest) that is never part of the release jar, and the runGametest task, which
// starts the server with -Dfabric-api.gametest and exits non-zero if any test fails.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "aurelia_transit_architecture_gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// The game test world is kept between runs, and MTR keeps its stations and lifts there; start each run from a fresh world
// so one run's MTR data cannot sit under the next run's test plots.
tasks.named("runGameTest") {
	doFirst {
		delete layout.buildDirectory.dir("run/gameTest/world")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// MTR is a required runtime dependency (declared in fabric.mod.json). V1 does not call MTR APIs,
	// so it is compile-only (not re-exported) and loaded in the dev runs to prove coexistence.
	modCompileOnly "maven.modrinth:minecraft-transit-railway:${project.mtr_version}"
	modLocalRuntime "maven.modrinth:minecraft-transit-railway:${project.mtr_version}"

	// Dev runs only (./gradlew runClient), for shader testing. modLocalRuntime never reaches the published jar,
	// its POM or fabric.mod.json. Iris 1.7.6 is the last 1.20.1 build and requires Sodium >= 0.5.12-beta.2;
	// Sodium 0.5.13 is the last 1.20.1 release. Both target Fabric API 0.92.x / loader >= 0.15.
	modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
	// Iris bundles these, but Loom does not load a dev-only mod's bundled libraries, and shader packs fail without them
	localRuntime "org.anarres:jcpp:1.4.14"
	localRuntime "io.github.douira:glsl-transformer:2.0.1"
	localRuntime "org.antlr:antlr4-runtime:4.13.1"

	// Pure-logic unit tests (text sanitising, caches, announcement queue, seat bookkeeping, pagination ...)
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// Runs the tests inside Fabric Loader so tests that need the game bootstrap (block state checks) can create blocks.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
	// The test classes share no files or ports, so they spread over several JVMs: every core on CI, half of them locally (the dev client keeps the rest)
	final int cores = Runtime.runtime.availableProcessors()
	maxParallelForks = System.getenv("CI") ? cores : Math.max(1, cores.intdiv(2))
	// CI runs the slowest class (StationRecipeTest's sweep, ~6 min in one method) as a job of its own and leaves it out of this one
	if (project.hasProperty("ata.tests.exclude")) {
		filter { excludeTestsMatching project.property("ata.tests.exclude") }
	}
}

// The dev-run shader stack must not start inside the unit tests (fabric-loader-junit loads every mod on the test classpath).
configurations.testRuntimeClasspath {
	exclude module: "sodium"
	exclude module: "iris"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
	withSourcesJar()
}

jar {
	from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
