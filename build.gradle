plugins {
	id "fabric-loom" version "1.10.5"
}

version = "${project.mod_version}+mc${project.minecraft_version}-fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	runs {
		configureEach { ideConfigGenerated = true }
		server { runDir = "run/server" }
		client { runDir = "run/client" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// MTR is a required runtime dependency (declared in fabric.mod.json). V1 does not call MTR APIs,
	// so it is compile-only (not re-exported) and loaded in the dev runs to prove coexistence.
	modCompileOnly "maven.modrinth:minecraft-transit-railway:${project.mtr_version}"
	modLocalRuntime "maven.modrinth:minecraft-transit-railway:${project.mtr_version}"

	// Pure-logic unit tests (text sanitising, caches, announcement queue, seat bookkeeping, pagination ...)
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// Runs the tests inside Fabric Loader so tests that need the game bootstrap (block state checks) can create blocks.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
	withSourcesJar()
}

jar {
	from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
