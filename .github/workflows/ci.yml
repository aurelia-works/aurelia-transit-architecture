name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The suites are split over jobs that run side by side, so the run takes as long as the slowest job (goal: under 5 minutes):
# build + unit tests, the StationRecipeTest sweep in 4 shards of looks, and the game tests in 2 servers (the airport rebuild test,
# real-time MTR waits for two airport builds, alone in one).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Loom remaps the 55 mod jars into the project's .gradle/loom-cache on every fresh checkout (~40 s); keep them between runs
      - uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: loom-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle') }}
      - name: Build and unit tests
        run: ./gradlew build test -x runGameTest -Pata.tests.exclude='*StationRecipeTest'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-build
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
      - name: Asset checks
        run: |
          python3 tools/verify_assets.py
          python3 tools/check_zfighting.py
  recipe-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: loom-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle') }}
      - name: StationRecipeTest, looks ${{ matrix.shard }}/4
        run: ./gradlew test -x runGameTest --tests '*StationRecipeTest' -Pata.sweep.shard=${{ matrix.shard }}/4
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-sweep-${{ matrix.shard }}
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # simple class names for -Pata.gametests (build.gradle); "!" keeps every class but those, so new classes land there
        classes: ['AirportMtrRebuildGameTests', '!AirportMtrRebuildGameTests']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: loom-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle') }}
      - name: Game tests ${{ matrix.classes }}
        run: ./gradlew runGameTest '-Pata.gametests=${{ matrix.classes }}'
