name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Unit tests, the StationRecipeTest sweep (one ~6 min method) and game tests run as three jobs side by side;
# the run takes as long as the slowest one
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew build test -x runGameTest -Pata.tests.exclude='*StationRecipeTest'
      - name: Asset checks
        run: |
          python3 tools/verify_assets.py
          python3 tools/check_zfighting.py
  recipe-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: StationRecipeTest
        run: ./gradlew test -x runGameTest --tests '*StationRecipeTest'
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Game tests
        run: ./gradlew runGameTest
